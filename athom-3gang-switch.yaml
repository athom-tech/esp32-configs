substitutions:
  # Default name
  name: "athom-3gang-switch"
  # Default friendly name   
  friendly_name: "3Gang Switch"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant. Typically used for areas such as 'Lounge Room', 'Kitchen' etc  
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "athom esp32-c3 3gang switch"
  # Project Name
  project_name: "China Athom Technology.3Gang Switch"
  # Projection version denotes the release version of the yaml file, allowing checking of deployed vs latest version
  project_version: "v3.0.6"
  # Restore the relay (GPO switch) upon reboot to state:
  light1_restore_mode: RESTORE_DEFAULT_OFF
  light2_restore_mode: RESTORE_DEFAULT_OFF
  light3_restore_mode: RESTORE_DEFAULT_OFF
  # Define a domain for this device to use. i.e. iot.home.lan (so device will appear as athom-smart-plug-v2.iot.home.lan in DNS/DHCP logs)
  dns_domain: ".local"
  # Set timezone of the smart plug. Useful if the plug is in a location different to the HA server. Can be entered in unix Country/Area format (i.e. "Australia/Sydney")
  timezone: ""
  # Set the duration between the sntp service polling ntp.org servers for an update
  sntp_update_interval: 6h
  # Network time servers for your region, enter from lowest to highest priority. To use local servers update as per zones or countries at: https://www.ntppool.org/zone/@
  sntp_server_1: "0.pool.ntp.org"
  sntp_server_2: "1.pool.ntp.org"
  sntp_server_3: "2.pool.ntp.org"  
  # Enables faster network connections, with last connected SSID being connected to and no full scan for SSID being undertaken
  wifi_fast_connect: "false"
  # Define logging level: NONE, ERROR, WARN, INFO, DEBUG (Default), VERBOSE, VERY_VERBOSE
  log_level: "DEBUG"
  # Enable or disable the use of IPv6 networking on the device
  ipv6_enable: "false"
########################## End of Substitutions #########################

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"  
  name_add_mac_suffix: true
  min_version: 2026.10.0
  project:
    name: "${project_name}"
    version: "${project_version}"
  platformio_options:
    board_build.mcu: esp32c3
    board_build.variant: esp32c3
    board_build.flash_mode: dio
  on_boot:
    - priority: 600
      then:
        - select.set_index:
            id: power_mode
            index: !lambda |-
                    return id(restore_mode)-1;
        - lambda: |-
              switch(id(restore_mode))
              {
              case 1:{
                      id(light1).turn_off();
                      id(light2).turn_off();
                      id(light3).turn_off();
                      break;
                            }
              case 2:{
                      id(light1).turn_on();
                      id(light2).turn_on();
                      id(light3).turn_on();
                      break;
                            }
              default:{
                      break;
                            }
              }

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  variant: ESP32C3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # @grigi found in testing that these options resulted in better responsiveness.
      # BLE 4.2 is supported by ALL ESP32 boards that have bluetooth, the original and derivatives.
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      # Also enable this on any derivative boards (S2, C3 etc) but not the original ESP32.
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      # Extend the watchdog timeout, so the device reboots if the device appears locked up for over 10 seconds.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

preferences:
  id: preferences_component
  flash_write_interval: 1min

api:
  id: api_component
  # reboot_timeout: 0s
  # Only enable BLE tracking when wifi is up and api is connected
  # Gives single-core ESP32-C3 devices time to manage wifi and authenticate with api
  on_client_connected:
     - esp32_ble_tracker.start_scan:
        continuous: true
  # Disable BLE tracking when there are no api connections live
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:

ota:
  - platform: esphome
    id: ota_esphome
  # Enables OTA firmware flashing from a URL (used by the update component below)
  - platform: http_request
    id: ota_http_request

# Required by the ota http_request platform and the update component.
# verify_ssl: false skips TLS cert validation to reduce heap/RAM pressure during
# the download; the manifest's MD5 still verifies firmware integrity before flashing.
http_request:
  id: http_request_component
  verify_ssl: false

update:
  # Managed updates via HTTP request: periodically checks the published manifest
  # and exposes a "Firmware Update" entity, pointing at this device's GitHub Pages
  # manifest. Pages URLs avoid the redirect/buffer issues of Release download URLs.
  - platform: http_request
    id: update_http_request
    name: "Firmware Update"
    source: https://athom-tech.github.io/esp32-configs/firmware/athom-3gang-switch.manifest.json
    # update_interval defaults to 6h (how often it checks, not installs)

logger:
  id: logger_component
  baud_rate: 0  # 0 Enables logging, but disables serial-port logging to free CPU and memory
  level: ${log_level}

mdns:
  id: mdns_component
  disabled: false

web_server:
  id: web_server_component
  port: 80
#  version: 3

network:
  id: network_component
  enable_ipv6: ${ipv6_enable}

wifi:
  id: wifi_component
  # This spawns an AP with the device name and mac address with no password.
  ap: {}
  # Allow rapid re-connection to previously connect WiFi SSID, skipping scan of all SSID
  fast_connect: "${wifi_fast_connect}"
  # Define dns domain / suffix to add to hostname
  domain: "${dns_domain}"

captive_portal:
  id: captive_portal_component

improv_ble:
  id: improv_ble_component
  authorizer: none

esp32_ble_tracker:
  id: esp32_ble_tracker_component
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 320ms  # default 320ms - how long to spend on each advert channel
    window:   300ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  id: bluetooth_proxy_component
  active: true

dashboard_import:
  package_import_url: github://athom-tech/esp32-configs/athom-3gang-switch.yaml

globals:
  - id: restore_mode
    type: int
    restore_value: yes
    initial_value: "3"

select:
  - platform: template
    name: "Power On State"
    id: "power_mode"
    optimistic: true
    options:
      - Always Off
      - Always On
      - Restore Power Off State
    on_value:
      then:
        - lambda: |-
            id(restore_mode)=i+1;

  - platform: template
    name: "Button1 Mode"
    id: button1_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Relay
    options:
      - Relay
      - Programmable

  - platform: template
    name: "Button2 Mode"
    id: button2_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Relay
    options:
      - Relay
      - Programmable

  - platform: template
    name: "Button3 Mode"
    id: button3_mode
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Relay
    options:
      - Relay
      - Programmable

event:
  - platform: template
    name: "Button1 Event"
    id: button1_event
    device_class: button
    event_types:
      - single_click
      - double_click
      - long_press

  - platform: template
    name: "Button2 Event"
    id: button2_event
    device_class: button
    event_types:
      - single_click
      - double_click
      - long_press

  - platform: template
    name: "Button3 Event"
    id: button3_event
    device_class: button
    event_types:
      - single_click
      - double_click
      - long_press

binary_sensor:
  - platform: status
    name: "Status"
    id: id_status
    icon: mdi:check-network-outline
    entity_category: diagnostic    

  #Button1
  - platform: gpio
    pin:
      inverted: true
      number: GPIO4
      mode:
        input: true
        pullup: true
    name: "Button1"
    id: button1
    disabled_by_default: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # Keep the original local relay controls in Relay mode.
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - if:
              condition:
                select.is:
                  id: button1_mode
                  options: Relay
              then:
                - light.toggle: light1
      - timing:
          - ON for at least 4s
        then:
          - if:
              condition:
                select.is:
                  id: button1_mode
                  options: Relay
              then:
                - button.press: Reset

      # In Programmable mode, the button reports events without toggling the relay.
      # Strictly below 1s / 300ms keeps the click and long-press windows separate.
      - timing:
          - ON for at most 999ms
          - OFF for at most 299ms
          - ON for at most 999ms
          - OFF for at least 300ms
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button1_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button1_event
                    event_type: double_click
      - timing:
          - ON for at most 999ms
          - OFF for at least 300ms
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button1_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button1_event
                    event_type: single_click
      - timing:
          - ON for at least 1s
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button1_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button1_event
                    event_type: long_press
      # Keep a physical recovery gesture, with extra time for programmable holds.
      - timing:
          - ON for at least 10s
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button1_mode
                  options: Programmable
              then:
                - button.press: Reset

  #Button2
  - platform: gpio
    pin:
      inverted: true
      number: GPIO20
      mode:
        input: true
        pullup: true
    name: "Button2"
    id: button2
    disabled_by_default: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # Keep the original local relay controls in Relay mode.
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - if:
              condition:
                select.is:
                  id: button2_mode
                  options: Relay
              then:
                - light.toggle: light2
      - timing:
          - ON for at least 4s
        then:
          - if:
              condition:
                select.is:
                  id: button2_mode
                  options: Relay
              then:
                - button.press: Reset

      # In Programmable mode, the button reports events without toggling the relay.
      # Strictly below 1s / 300ms keeps the click and long-press windows separate.
      - timing:
          - ON for at most 999ms
          - OFF for at most 299ms
          - ON for at most 999ms
          - OFF for at least 300ms
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button2_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button2_event
                    event_type: double_click
      - timing:
          - ON for at most 999ms
          - OFF for at least 300ms
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button2_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button2_event
                    event_type: single_click
      - timing:
          - ON for at least 1s
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button2_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button2_event
                    event_type: long_press
      # Keep a physical recovery gesture, with extra time for programmable holds.
      - timing:
          - ON for at least 10s
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button2_mode
                  options: Programmable
              then:
                - button.press: Reset

  #Button3
  - platform: gpio
    pin:
      inverted: true
      number: GPIO19
      mode:
        input: true
        pullup: true
    name: "Button3"
    id: button3
    disabled_by_default: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # Keep the original local relay controls in Relay mode.
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - if:
              condition:
                select.is:
                  id: button3_mode
                  options: Relay
              then:
                - light.toggle: light3
      - timing:
          - ON for at least 4s
        then:
          - if:
              condition:
                select.is:
                  id: button3_mode
                  options: Relay
              then:
                - button.press: Reset

      # In Programmable mode, the button reports events without toggling the relay.
      # Strictly below 1s / 300ms keeps the click and long-press windows separate.
      - timing:
          - ON for at most 999ms
          - OFF for at most 299ms
          - ON for at most 999ms
          - OFF for at least 300ms
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button3_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button3_event
                    event_type: double_click
      - timing:
          - ON for at most 999ms
          - OFF for at least 300ms
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button3_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button3_event
                    event_type: single_click
      - timing:
          - ON for at least 1s
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button3_mode
                  options: Programmable
              then:
                - event.trigger:
                    id: button3_event
                    event_type: long_press
      # Keep a physical recovery gesture, with extra time for programmable holds.
      - timing:
          - ON for at least 10s
        invalid_cooldown: 0s
        then:
          - if:
              condition:
                select.is:
                  id: button3_mode
                  options: Programmable
              then:
                - button.press: Reset

sensor:
  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor
    type:
      timestamp
    entity_category: "diagnostic"

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    id: wifi_signal_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

button:
  - platform: restart
    name: "Restart"
    id: id_restart
    entity_category: config

  - platform: factory_reset
    name: "Factory Reset"
    id: Reset
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    id: id_safe_mode
    internal: false
    entity_category: config

output:
  # Relay
  - platform: gpio
    pin: GPIO5
    id: relay1
  - platform: gpio
    pin: GPIO18
    id: relay2
  - platform: gpio
    pin: GPIO8
    id: relay3
  # Button LED
  - platform: ledc
    pin: GPIO2
    inverted: true
    id: button_led1
  - platform: ledc
    pin: GPIO3
    inverted: true
    id: button_led2
  - platform: ledc
    pin: GPIO21
    inverted: true
    id: button_led3

light:
  - platform: status_led
    name: "Status LED"
    id: red_led
    icon: mdi:lightbulb-outline
    disabled_by_default: true
    pin:
      inverted: true
      number: GPIO9
  # Relay
  - platform: binary
    name: "Light1"
    id: light1
    output: relay1
    restore_mode: ${light1_restore_mode}
    on_turn_on:
      - light.turn_on: led1
    on_turn_off:
      - light.turn_off: led1
  - platform: binary
    name: "Light2"
    id: light2
    output: relay2
    restore_mode: ${light2_restore_mode}
    on_turn_on:
      - light.turn_on: led2
    on_turn_off:
      - light.turn_off: led2
  - platform: binary
    name: "Light3"
    id: light3
    output: relay3
    restore_mode: ${light3_restore_mode}
    on_turn_on:
      - light.turn_on: led3
    on_turn_off:
      - light.turn_off: led3
  # Button LED
  - platform: monochromatic
    name: "LED1"
    disabled_by_default: true
    id: led1
    output: button_led1
    default_transition_length: 500ms
  - platform: monochromatic
    name: "LED2"
    disabled_by_default: true
    id: led2
    output: button_led2
    default_transition_length: 500ms
  - platform: monochromatic
    name: "LED3"
    disabled_by_default: true
    id: led3
    output: button_led3
    default_transition_length: 500ms

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
      icon: mdi:ip-network
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      id: ssid
      icon: mdi:wifi-strength-2
      entity_category: diagnostic
    mac_address:
      name: "Mac Address"
      id: mac_address
      icon: mdi:network-pos
      entity_category: diagnostic

  #  Creates a sensor showing when the device was last restarted
  - platform: template
    name: 'Last Restart'
    id: device_last_restart
    icon: mdi:clock
    entity_category: diagnostic
#    device_class: timestamp

time:
  - platform: sntp
    id: sntp_time
  # Define the timezone of the device
    timezone: "${timezone}"
  # Change sync interval from default 5min to 6 hours (or as set in substitutions)
    update_interval: ${sntp_update_interval}
  # Set specific sntp servers to use
    servers: 
      - "${sntp_server_1}"
      - "${sntp_server_2}"
      - "${sntp_server_3}"    
  # Publish the time the device was last restarted
    on_time_sync:
      then:
        # Update last restart time, but only once.
        - if:
            condition:
              lambda: 'return id(device_last_restart).state == "";'
            then:
              - text_sensor.template.publish:
                  id: device_last_restart
                  state: !lambda 'return id(sntp_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'