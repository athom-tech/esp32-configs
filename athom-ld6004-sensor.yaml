    detection_area_3:
      name: "Detection Area 3 Presence"
      id: ld6004_detection_area_3_presence

  - platform: status
    name: "Status"
    id: id_status
    entity_category: diagnostic

  - platform: gpio
    pin:
      number: ${BUTTON_PIN}
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    id: gpio_button
    disabled_by_default: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      - timing:
          - ON for at least 4s
        then:
          - button.press: Reset

  - platform: gpio
    pin:
      number: ${PIR_PIN}
      mode:
        input: true
        pullup: true
    name: "Pir Sensor"
    id: pir
    filters:
      - delayed_on: 30ms
    device_class: motion

  - platform: gpio
    pin:
      number: ${RADAR_OUT_PIN}
      mode:
        input: true
        pullup: true
    name: "mmWave Sensor"
    id: mmwave
    filters:
      - delayed_on: 30ms
    device_class: motion
    on_release:
      then:
        - light.turn_off: led

  - platform: template
    name: "Occupancy"
    id: occupancy
    device_class: occupancy
    lambda: |-
      if ( id(mmwave).state and id(pir).state) {
        return true;
      }
      else if (id(mmwave).state == 0) {
        return false;
      }
      else {
        return id(occupancy).state;
      }

