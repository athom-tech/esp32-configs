# Athom Presence Sensor Pro with an external SHT40 temperature and humidity sensor.
substitutions:
  firmware_variant: "With sht40 sensor"
  firmware_file: "${firmware_base_file}-sht40"
  # Fixed calibration offsets applied before the user-adjustable offsets
  temperature_offset: "0"
  humidity_offset: "0"
  # SHT40 polling interval
  sensor_update_interval: 5s

packages:
  base: !include athom-presence-sensor-pro.yaml

i2c:
  - id: external_sensor_i2c
    sda: ${SENSOR_SDA_PIN}
    scl: ${SENSOR_SCL_PIN}
    scan: true

sensor:
  - platform: sht4x
    i2c_id: external_sensor_i2c
    id: sht40_sensor
    update_interval: ${sensor_update_interval}
    temperature:
      name: "Temperature"
      id: temperature_sensor
      filters:
        - offset: ${temperature_offset}
        - lambda: "return x + id(temperature_offset_selection).state;"
    humidity:
      name: "Humidity"
      id: humidity_sensor
      filters:
        - offset: ${humidity_offset}
        - lambda: "return x + id(humidity_offset_selection).state;"

number:
  - platform: template
    name: "Temperature Offset"
    id: temperature_offset_selection
    unit_of_measurement: "°C"
    min_value: -10
    max_value: 10
    step: 0.1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:thermometer"
    entity_category: config
    on_value:
      - component.update: sht40_sensor

  - platform: template
    name: "Humidity Offset"
    id: humidity_offset_selection
    unit_of_measurement: "%"
    min_value: -30
    max_value: 30
    step: 0.1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:water-percent"
    entity_category: config
    on_value:
      - component.update: sht40_sensor
