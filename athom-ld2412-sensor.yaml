substitutions:
  name: "athom-ld2412-sensor"
  friendly_name: "Athom LD2412 Sensor"
  room: ""
  device_description: "athom esp32c6 ld2412 motion and presence sensor"
  project_name: "China Athom Technology.PS02C3 Pro (LD2412)"
  project_version: "v6.0.2"
  update_interval: 60s
  # Define a domain for this device to use. i.e. iot.home.lan (so device will appear as athom-smart-plug-v2.iot.home.lan in DNS/DHCP logs)
  dns_domain: ""
  # Set timezone of the smart plug. Useful if the plug is in a location different to the HA server. Can be entered in unix Country/Area format (i.e. "Australia/Sydney")
  timezone: ""
  # Set the duration between the sntp service polling ntp.org servers for an update
  sntp_update_interval: 6h
  # Network time servers for your region, enter from lowest to highest priority. To use local servers update as per zones or countries at: https://www.ntppool.org/zone/@
  sntp_server_1: "0.pool.ntp.org"
  sntp_server_2: "1.pool.ntp.org"
  sntp_server_3: "2.pool.ntp.org"
  # Enables faster network connections, with last connected SSID being connected to and no full scan for SSID being undertaken
  wifi_fast_connect: "false"
  # Define logging level: NONE, ERROR, WARN, INFO, DEBUG (Default), VERBOSE, VERY_VERBOSE
  log_level: "NONE"
  # Enable or disable the use of IPv6 networking on the device
  ipv6_enable: "false"
  firmware_base_file: "athom-ld2412-sensor"
  firmware_variant: "Standard"
  firmware_file: "${firmware_base_file}"
  firmware_url: "https://athom-tech.github.io/esp32-configs/firmware"

#########################GPIO#################
  BH1750_SDA_PIN: GPIO6
  BH1750_SCL_PIN: GPIO7
  RADAR_OUT_PIN: GPIO2
  SENSOR_SDA_PIN: GPIO13
  SENSOR_SCL_PIN: GPIO12
  RADAR_TX: GPIO20
  RADAR_RX: GPIO21
  PIR_PIN: GPIO3
  LED_PIN: GPIO14
  BUTTON_PIN: GPIO9
#########################GPIO#################

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  name_add_mac_suffix: true
  min_version: 2026.11.0
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(firmware_switch_update).add_on_state_callback([]() {
            auto &target = id(firmware_target_file);
            if (target.empty()) {
              return;
            }
            const auto &info = id(firmware_switch_update).update_info;
            // Releases name each binary <yaml-stem>-<device-name>-esp32c6.ota.bin.
            const std::string expected_url = "${firmware_url}/" + target + "-${firmware_base_file}-esp32c6.ota.bin";
            if (info.firmware_url == expected_url && info.md5.size() == 32 &&
                info.md5.find_first_not_of("0123456789abcdef") == std::string::npos) {
              target.clear();
            }
          });

esp32:
  board: esp32-c6-devkitm-1
  flash_size: 8MB
  flash_mode: dio
  variant: ESP32C6
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # @grigi found in testing that these options resulted in better responsiveness.
      # BLE 4.2 is supported by ALL ESP32 boards that have bluetooth, the original and derivatives.
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      # Also enable this on any derivative boards (S2, C3 etc) but not the original ESP32.
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      # Extend the watchdog timeout, so the device reboots if the device appears locked up for over 10 seconds.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

globals:
  - id: firmware_target_file
    type: std::string
    restore_value: false
    initial_value: '""'

logger:
  id: logger_component
  baud_rate: 115200
  hardware_uart: UART0
  boot_log_level: ${log_level}
  level: ${log_level}

mdns:
  id: mdns_component
  disabled: false

web_server:
  id: web_server_component
  port: 80

ota:
  - platform: http_request
    id: ota_http_request
  - platform: http_request
    id: ota_firmware_switch
  - platform: esphome
    id: ota_esphome

# Required by the ota http_request platform and the update component.
# verify_ssl: false skips TLS cert validation to reduce heap/RAM pressure during
# the download; the manifest's MD5 still verifies firmware integrity before flashing.
http_request:
  id: http_request_component
  verify_ssl: false

update:
  - platform: http_request
    id: update_http_request
    name: "Firmware Update"
    ota_id: ota_http_request
    source: ${firmware_url}/${firmware_file}.manifest.json
  # Only the install script checks the selected variant's manifest.
  - platform: http_request
    id: firmware_switch_update
    internal: true
    ota_id: ota_firmware_switch
    source: ${firmware_url}/${firmware_file}.manifest.json
    update_interval: never

network:
  id: network_component
  enable_ipv6: ${ipv6_enable}

wifi:
  id: wifi_component
  # This spawns an AP with the device name and mac address with no password.
  ap: {}
  # Allow rapid re-connection to previously connect WiFi SSID, skipping scan of all SSID
  fast_connect: "${wifi_fast_connect}"
  # Define dns domain / suffix to add to hostname
  domain: "${dns_domain}"

captive_portal:
  id: captive_portal_component

esp32_ble_tracker:
  id: esp32_ble_tracker_component
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 320ms  # default 320ms - how long to spend on each advert channel
    window:   300ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

# Enable Home Assistant API
api:
  id: api_component
  on_client_connected:
    - esp32_ble_tracker.start_scan:
       continuous: true
  on_client_disconnected:
    - esp32_ble_tracker.stop_scan:

bluetooth_proxy:
  id: bluetooth_proxy_component
  active: true

improv_ble:
  id: improv_ble_component
  authorizer: none

dashboard_import:
  package_import_url: github://athom-tech/esp32-configs/${firmware_file}.yaml

light:
  - platform: status_led
    name: "Status LED"
    id: led
    pin: ${LED_PIN}
    disabled_by_default: true
    entity_category: config

i2c:
  - id: i2c_bus_lp
    sda: ${BH1750_SDA_PIN}
    scl: ${BH1750_SCL_PIN}
    low_power_mode: true
    scan: true

uart:
  id: uart_ld2412
  tx_pin: ${RADAR_TX}
  rx_pin: ${RADAR_RX}
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1

ld2412:
  id: ld2412_radar
  uart_id: uart_ld2412

button:
  - platform: template
    name: "Install Selected Firmware"
    id: template_install_firmware_variant
    icon: mdi:cellphone-arrow-down
    entity_category: config
    on_press:
      - script.execute:
          id: install_firmware_variant
          target_file: !lambda |-
            const auto variant = id(firmware_variant_select).current_option();
            std::string file = "${firmware_base_file}";
            if (variant == "With sht40 sensor") {
              file += "-sht40";
            } else if (variant == "With scd40 sensor") {
              file += "-scd40";
            }
            return file;

  - platform: ld2412
    ld2412_id: ld2412_radar
    factory_reset:
      name: "Radar Factory Reset"
      id: ld2412_factory_reset
    restart:
      name: "Restart Radar"
      id: ld2412_restart
    start_dynamic_background_correction:
      name: "Start Dynamic Background Correction"
      id: ld2412_start_dynamic_background_correction

  - platform: factory_reset
    name: Restart with Factory Default Settings
    id: Reset
    entity_category: config

  - platform: restart
    name: Restart_esp
    id: restart_esp
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    id: id_safe_mode
    internal: false
    entity_category: config

sensor:
  - platform: ld2412
    ld2412_id: ld2412_radar
    moving_distance:
      name: "Moving Distance"
      id: ld2412_moving_distance
    still_distance:
      name: "Still Distance"
      id: ld2412_still_distance
    detection_distance:
      name: "Detection Distance"
      id: ld2412_detection_distance
    moving_energy:
      name: "Moving Energy"
      id: ld2412_moving_energy
    still_energy:
      name: "Still Energy"
      id: ld2412_still_energy


  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor
    type:
      timestamp
    entity_category: "diagnostic"

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    id: wifi_signal_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

  - platform: bh1750
    name: "Light Sensor"
    id: "bh1750_sensor"
    i2c_id: i2c_bus_lp
    address: 0x23
    update_interval: 5s

binary_sensor:
  - platform: ld2412
    ld2412_id: ld2412_radar
    has_target:
      name: "Presence"
      id: ld2412_presence
    has_moving_target:
      name: "Moving Target"
      id: ld2412_has_moving_target
    has_still_target:
      name: "Still Target"
      id: ld2412_has_still_target
    dynamic_background_correction_status:
      name: "Dynamic Background Correction Status"
      id: ld2412_dynamic_background_correction_status

  - platform: status
    name: "Status"
    id: id_status
    entity_category: diagnostic

  - platform: gpio
    pin:
      number: ${BUTTON_PIN}
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    id: gpio_button
    disabled_by_default: true
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      - timing:
          - ON for at least 4s
        then:
          - button.press: Reset

  - platform: gpio
    pin:
      number: ${PIR_PIN}
      mode:
        input: true
        pullup: true
    name: "Pir Sensor"
    id: pir
    filters:
      - delayed_on: 30ms
    device_class: motion

  - platform: gpio
    pin:
      number: ${RADAR_OUT_PIN}
      mode:
        input: true
        pullup: true
    name: "mmWave Sensor"
    id: mmwave
    filters:
      - delayed_on: 30ms
    device_class: motion
    on_release:
      then:
        - light.turn_off: led

  - platform: template
    name: "Occupancy"
    id: occupancy
    device_class: occupancy
    lambda: |-
      if ( id(mmwave).state and id(pir).state) {
        return true;
      }
      else if (id(mmwave).state == 0) {
        return false;
      }
      else {
        return id(occupancy).state;
      }

switch:
  - platform: ld2412
    ld2412_id: ld2412_radar
    engineering_mode:
      name: "Engineering Mode"
      id: ld2412_engineering_mode
    bluetooth:
      name: "Radar Bluetooth"
      id: ld2412_bluetooth

text_sensor:
  - platform: ld2412
    ld2412_id: ld2412_radar
    version:
      name: "Radar Firmware Version"
      id: ld2412_version
    mac_address:
      name: "Radar Bluetooth MAC Address"
      id: ld2412_mac_address

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      id: ssid
      entity_category: diagnostic
    mac_address:
      name: "Mac Address"
      id: mac_address
      entity_category: diagnostic

  #  Creates a sensor showing when the device was last restarted
  - platform: template
    name: 'Last Restart'
    id: device_last_restart
    icon: mdi:clock
    entity_category: diagnostic
#    device_class: timestamp

number:
  - platform: ld2412
    ld2412_id: ld2412_radar
    timeout:
      name: "Presence Timeout"
      id: ld2412_timeout
    min_distance_gate:
      name: "Minimum Distance Gate"
      id: ld2412_min_distance_gate
    max_distance_gate:
      name: "Maximum Distance Gate"
      id: ld2412_max_distance_gate
    light_threshold:
      name: "Light Threshold"
      id: ld2412_light_threshold
    gate_0:
      move_threshold:
        name: "Gate 0 Move Threshold"
        id: ld2412_gate_0_move_threshold
      still_threshold:
        name: "Gate 0 Still Threshold"
        id: ld2412_gate_0_still_threshold
    gate_1:
      move_threshold:
        name: "Gate 1 Move Threshold"
        id: ld2412_gate_1_move_threshold
      still_threshold:
        name: "Gate 1 Still Threshold"
        id: ld2412_gate_1_still_threshold
    gate_2:
      move_threshold:
        name: "Gate 2 Move Threshold"
        id: ld2412_gate_2_move_threshold
      still_threshold:
        name: "Gate 2 Still Threshold"
        id: ld2412_gate_2_still_threshold
    gate_3:
      move_threshold:
        name: "Gate 3 Move Threshold"
        id: ld2412_gate_3_move_threshold
      still_threshold:
        name: "Gate 3 Still Threshold"
        id: ld2412_gate_3_still_threshold
    gate_4:
      move_threshold:
        name: "Gate 4 Move Threshold"
        id: ld2412_gate_4_move_threshold
      still_threshold:
        name: "Gate 4 Still Threshold"
        id: ld2412_gate_4_still_threshold
    gate_5:
      move_threshold:
        name: "Gate 5 Move Threshold"
        id: ld2412_gate_5_move_threshold
      still_threshold:
        name: "Gate 5 Still Threshold"
        id: ld2412_gate_5_still_threshold
    gate_6:
      move_threshold:
        name: "Gate 6 Move Threshold"
        id: ld2412_gate_6_move_threshold
      still_threshold:
        name: "Gate 6 Still Threshold"
        id: ld2412_gate_6_still_threshold
    gate_7:
      move_threshold:
        name: "Gate 7 Move Threshold"
        id: ld2412_gate_7_move_threshold
      still_threshold:
        name: "Gate 7 Still Threshold"
        id: ld2412_gate_7_still_threshold
    gate_8:
      move_threshold:
        name: "Gate 8 Move Threshold"
        id: ld2412_gate_8_move_threshold
      still_threshold:
        name: "Gate 8 Still Threshold"
        id: ld2412_gate_8_still_threshold
    gate_9:
      move_threshold:
        name: "Gate 9 Move Threshold"
        id: ld2412_gate_9_move_threshold
      still_threshold:
        name: "Gate 9 Still Threshold"
        id: ld2412_gate_9_still_threshold
    gate_10:
      move_threshold:
        name: "Gate 10 Move Threshold"
        id: ld2412_gate_10_move_threshold
      still_threshold:
        name: "Gate 10 Still Threshold"
        id: ld2412_gate_10_still_threshold
    gate_11:
      move_threshold:
        name: "Gate 11 Move Threshold"
        id: ld2412_gate_11_move_threshold
      still_threshold:
        name: "Gate 11 Still Threshold"
        id: ld2412_gate_11_still_threshold
    gate_12:
      move_threshold:
        name: "Gate 12 Move Threshold"
        id: ld2412_gate_12_move_threshold
      still_threshold:
        name: "Gate 12 Still Threshold"
        id: ld2412_gate_12_still_threshold
    gate_13:
      move_threshold:
        name: "Gate 13 Move Threshold"
        id: ld2412_gate_13_move_threshold
      still_threshold:
        name: "Gate 13 Still Threshold"
        id: ld2412_gate_13_still_threshold

select:
  - platform: template
    name: "Firmware Variant"
    id: firmware_variant_select
    icon: mdi:chip
    entity_category: config
    optimistic: true
    restore_value: false
    options:
      - "Standard"
      - "With sht40 sensor"
      - "With scd40 sensor"
    initial_option: "${firmware_variant}"

  - platform: ld2412
    ld2412_id: ld2412_radar
    distance_resolution:
      name: "Distance Resolution"
      id: ld2412_distance_resolution

script:
  - id: install_firmware_variant
    mode: single
    parameters:
      target_file: string
    then:
      - if:
          condition:
            lambda: 'return target_file == "${firmware_file}";'
          then:
            - logger.log:
                format: "Firmware variant ${firmware_variant} is already running"
                level: INFO
            - script.stop: install_firmware_variant

      - if:
          condition:
            lambda: |-
              return id(firmware_switch_update).state == update::UPDATE_STATE_INSTALLING ||
                     id(update_http_request).state == update::UPDATE_STATE_INSTALLING;
          then:
            - script.stop: install_firmware_variant

      - lambda: |-
          id(firmware_target_file) = target_file;
          id(firmware_switch_update).set_source_url("${firmware_url}/" + target_file + ".manifest.json");
          ESP_LOGI("FW_VARIANT", "Checking firmware for %s", target_file.c_str());
      - update.check: firmware_switch_update
      - wait_until:
          condition:
            lambda: 'return id(firmware_target_file).empty();'
          timeout: 60s
      - if:
          condition:
            lambda: 'return !id(firmware_target_file).empty();'
          then:
            - lambda: 'id(firmware_target_file).clear();'
            - logger.log:
                format: "No matching firmware manifest received, switch aborted"
                level: ERROR
            - script.stop: install_firmware_variant

      - if:
          condition:
            lambda: 'return id(update_http_request).state == update::UPDATE_STATE_INSTALLING;'
          then:
            - logger.log:
                format: "A firmware update is already installing"
                level: WARN
            - script.stop: install_firmware_variant

      - update.perform:
          id: firmware_switch_update
          force_update: true

time:
  - platform: sntp
    id: sntp_time
  # Define the timezone of the device
    timezone: "${timezone}"
  # Change sync interval from default 5min to 6 hours (or as set in substitutions)
    update_interval: ${sntp_update_interval}
  # Set specific sntp servers to use
    servers:
      - "${sntp_server_1}"
      - "${sntp_server_2}"
      - "${sntp_server_3}"
  # Publish the time the device was last restarted
    on_time_sync:
      then:
        # Update last restart time, but only once.
        - if:
            condition:
              lambda: 'return id(device_last_restart).state == "";'
            then:
              - text_sensor.template.publish:
                  id: device_last_restart
                  state: !lambda 'return id(sntp_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'
