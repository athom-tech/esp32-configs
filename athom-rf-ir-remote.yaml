substitutions:
  # Default name
  name: "athom-rf-ir-remote"
  # Default friendly name
  friendly_name: "Athom RF IR Remote"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant. Typically used for areas such as 'Lounge Room', 'Kitchen' etc
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "athom esp32 RF433 IR Remote"
  # Project Name
  project_name: "China Athom Technology.Athom RF IR Remote"
  # Projection version denotes the release version of the yaml file, allowing checking of deployed vs latest version
  project_version: "v3.2.0"
  # Define a domain for this device to use. i.e. iot.home.lan (so device will appear as athom-smart-plug-v2.iot.home.lan in DNS/DHCP logs)
  dns_domain: ".local"
  # Set timezone of the smart plug. Useful if the plug is in a location different to the HA server. Can be entered in unix Country/Area format (i.e. "Australia/Sydney")
  timezone: ""
  # Set the duration between the sntp service polling ntp.org servers for an update
  sntp_update_interval: 6h
  # Network time servers for your region, enter from lowest to highest priority. To use local servers update as per zones or countries at: https://www.ntppool.org/zone/@
  sntp_server_1: "0.pool.ntp.org"
  sntp_server_2: "1.pool.ntp.org"
  sntp_server_3: "2.pool.ntp.org"
  # Enables faster network connections, with last connected SSID being connected to and no full scan for SSID being undertaken
  wifi_fast_connect: "false"
  # Define logging level: NONE, ERROR, WARN, INFO, DEBUG (Default), VERBOSE, VERY_VERBOSE
  log_level: "DEBUG"
  # Enable or disable the use of IPv6 networking on the device
  ipv6_enable: "false"
  # valid value: ballu, coolix, daikin, daikin_arc, daikin_brc, delonghi, emmeti, fujitsu_general, gree, hitachi_ac344, hitachi_ac424, climate_ir_lg, midea_ir, mitsubishi, noblex, tcl112, toshiba, whirlpool, yashima, whynter, zhlt01, heatpumpir
  # https://esphome.io/components/climate/climate_ir/
  AC_Platform_name: "coolix"

#########################GPIO######################
  RF_RX_PIN: GPIO19
  RF_TX_PIN: GPIO18
  IR_RX_PIN: GPIO33
  IR_TX_PIN: GPIO25
  Button_PIN: GPIO0
  LED_PIN: GPIO27
#########################GPIO######################

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  name_add_mac_suffix: true
  min_version: 2026.5.1
  project:
    name: "${project_name}"
    version: "${project_version}"
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  variant: esp32
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # @grigi found in testing that these options resulted in better responsiveness.
      # BLE 4.2 is supported by ALL ESP32 boards that have bluetooth, the original and derivatives.
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      # Extend the watchdog timeout, so the device reboots if the device appears locked up for over 10 seconds.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

preferences:
  flash_write_interval: 1min

# Global variables for IR learning
globals:
  - id: is_learning_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: signal_select_index
    type: int
    restore_value: yes
    initial_value: '0'
  - id: filter_size
    type: int
    restore_value: no
    initial_value: '10'
  # RF433 learning mode flag (independent from IR learning)
  - id: is_rf_learning_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  # RF433 slot index, offset to 10-25 so it never collides with IR slots 0-9
  - id: rf_signal_select_index
    type: int
    restore_value: yes
    initial_value: '10'
  # Temp holders for the rc_switch code/protocol to transmit; referenced by
  # transmit_rc_switch_raw's !lambda during playback
  - id: rf_tx_code
    type: uint64_t
    restore_value: no
    initial_value: '0'
  - id: rf_tx_protocol
    type: int
    restore_value: no
    initial_value: '0'
  # Scratch waveform for A-OK playback; transmit_raw's code lambda must return
  # std::vector<int32_t>, so the global matches that type exactly
  - id: rf_aok_buf
    type: std::vector<int32_t>
    restore_value: no
    initial_value: 'std::vector<int32_t>()'

# Flash storage component for saving IR signals
Flash_comp:
  id: signal_nvs

api:
  reboot_timeout: 0s
  # Only enable BLE tracking when wifi is up and api is connected
  # Gives single-core ESP32-C3 devices time to manage wifi and authenticate with api
  on_client_connected:
     - esp32_ble_tracker.start_scan:
        continuous: true
  # Disable BLE tracking when there are no api connections live
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:

ota:
  - platform: esphome
    id: ota_esphome
  # Enables OTA firmware flashing from a URL (used by the update component below)
  - platform: http_request
    id: ota_http_request

# Required by the ota http_request platform and the update component.
# verify_ssl: false skips TLS cert validation to reduce heap/RAM pressure during
# the download; the manifest's MD5 still verifies firmware integrity before flashing.
http_request:
  id: http_request_component
  verify_ssl: false

update:
  # Managed updates via HTTP request: periodically checks the published manifest
  # and exposes a "Firmware Update" entity, pointing at this device's GitHub Pages
  # manifest. Pages URLs avoid the redirect/buffer issues of Release download URLs.
  - platform: http_request
    id: update_http_request
    name: "Firmware Update"
    source: https://athom-tech.github.io/esp32-configs/firmware/athom-rf-ir-remote.manifest.json
    # update_interval defaults to 6h (how often it checks, not installs)

logger:
  baud_rate: 0
  level: ${log_level}

mdns:
  disabled: false

web_server:
  port: 80
  version: 3

network:
  enable_ipv6: ${ipv6_enable}

wifi:
  # This spawns an AP with the device name and mac address with no password.
  ap: {}
  # Allow rapid re-connection to previously connect WiFi SSID, skipping scan of all SSID
  fast_connect: "${wifi_fast_connect}"
  # Define dns domain / suffix to add to hostname
  domain: "${dns_domain}"

esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 320ms  # default 320ms - how long to spend on each advert channel
    window:   300ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  active: true

captive_portal:

esp32_improv:
  authorizer: none

dashboard_import:
  package_import_url: github://athom-tech/esp32-configs/athom-rf-ir-remote.yaml

# Include the local Flash storage component
external_components:
  - source: github://athom-tech/esp32-configs@main
    components: [Flash_comp]

remote_receiver:
  - pin:
      number: ${RF_RX_PIN}
      inverted: true
    # dooya is dumped alongside rc_switch so that a Dooya remote press is
    # visible in the log as [remote.dooya] lines even outside learning mode -
    # if a press decodes but learning misses it, the two can be told apart.
    dump:
      - rc_switch
      - dooya
    # RF433 fixed-code decoding: filter glitches, split frames on 4ms idle,
    # and widen tolerance for cheap remotes. rc_switch decoding rejects the
    # receiver's ambient noise, so learning no longer false-triggers.
    filter: 4us
    idle: 4ms
    tolerance: 50%
    id: rf_receiver
    # Slot storage format: [type, code_hi, code_lo].
    #   type  1..8 -> rc_switch protocol number (the original format, unchanged)
    #   type  -1   -> Dooya, code packs the decoded fields (see on_dooya)
    #   type  -2   -> A-OK, code is the 64-bit frame content
    # A negative type can never collide with an rc_switch protocol, so slots
    # learned by older firmware keep playing, and older firmware refuses newer
    # slots safely (its playback requires protocol > 0).
    on_rc_switch:
      - lambda: |-
          if (id(is_rf_learning_mode)) {
            // A-OK covers/awnings (reverse-engineered in
            // github.com/akirjavainen/A-OK): 65-bit frames of
            // [start 0xA3][24-bit ID][16-bit address][8-bit cmd][8-bit
            // checksum][constant 1]. rc_switch protocol 6 is the same
            // pulse-distance scheme, so it decodes the first 64 bits
            // correctly; the constant trailing 1 never reaches the code.
            // rc_switch cannot report a bit count, but the checksum only
            // validates if all 64 bits arrived, so a passing checksum is
            // both the completeness check and the protocol identification:
            // shorter codes (EV1527 etc.) have a zero top byte, never 0xA3.
            if (x.protocol == 6) {
              uint8_t b[8];
              for (int i = 0; i < 8; i++) b[i] = (uint8_t) (x.code >> (56 - 8 * i));
              uint8_t cks = (uint8_t) ((b[1] + b[2] + b[3] + b[4] + b[5] + b[6]) & 0xFF);
              if (b[0] == 0xA3 && cks == b[7]) {
                // The remote follows every UP/DOWN with an "after up/down"
                // burst (cmd 0x24). Storing that instead of the button's real
                // command would be useless, so skip it and keep listening -
                // the real command was already stored from the first burst,
                // or will arrive on the next press.
                if (b[6] == 0x24) {
                  ESP_LOGD("RF_LEARNING", "Ignoring A-OK follow-up frame (cmd 0x24)");
                  return;
                }
                std::vector<int> d;
                d.push_back(-2);
                d.push_back((int) (x.code >> 32));
                d.push_back((int) (x.code & 0xFFFFFFFF));
                id(signal_nvs).save_to_nvs(id(rf_signal_select_index), d);
                ESP_LOGI("RF_LEARNING", "Learned A-OK id=0x%02X%02X%02X address=0x%02X%02X cmd=0x%02X slot=%d",
                         b[1], b[2], b[3], b[4], b[5], b[6], id(rf_signal_select_index));
                id(is_rf_learning_mode) = false;
                id(rf_status_text).publish_state("A-OK signal learned!");
                return;
              }
            }
            std::vector<int> d;
            d.push_back((int) x.protocol);
            d.push_back((int) (x.code >> 32));
            d.push_back((int) (x.code & 0xFFFFFFFF));
            id(signal_nvs).save_to_nvs(id(rf_signal_select_index), d);
            ESP_LOGI("RF_LEARNING", "Learned protocol=%u code=%llu slot=%d",
                     x.protocol, (unsigned long long) x.code, id(rf_signal_select_index));
            id(is_rf_learning_mode) = false;
            id(rf_status_text).publish_state("Signal learned!");
          }
    # Dooya learning from raw timings. On this board the receiver's captures
    # are sign-flipped and start at the ~1500us header SPACE - the 5000us
    # header mark is swallowed as pre-capture idle - so ESPHome's on_dooya
    # decoder (which demands the 5000/1500 header as its first item) can never
    # match. This is also why A-OK remotes decode only via rc_switch protocol
    # 6, the table's single inverted entry. Rather than flipping the pin's
    # inverted flag (which would break protocol-6 A-OK learning and every
    # already-learned rc_switch slot), Dooya is decoded here from magnitudes
    # alone: strip header items >= 1400us, require the 79 or 80 symbols of a
    # 40-bit frame, and read bits as (long,short)=1 / (short,long)=0.
    on_raw:
      - lambda: |-
          if (!id(is_rf_learning_mode))
            return;
          std::vector<int> body;
          body.reserve(80);
          for (int32_t v : x) {
            int m = v < 0 ? -v : v;
            if (m >= 1400) continue;      // header space / inter-frame gap
            if (m < 150) return;          // glitch: not a clean frame
            body.push_back(m);
          }
          if (body.size() != 79 && body.size() != 80)
            return;
          // Classify short (~350us) vs long (~750us); reject anything that
          // sits ambiguously between the two grids.
          uint64_t bits = 0;
          int nbits = 0;
          for (size_t i = 0; i + 1 < body.size(); i += 2) {
            bool a_long = body[i] > 540, b_long = body[i + 1] > 540;
            if (a_long == b_long) return; // not a valid Dooya symbol pair
            bits = (bits << 1) | (a_long ? 1 : 0);
            nbits++;
          }
          if (body.size() == 79) {
            // The final bit's space merged into the gap; its mark alone
            // determines the value.
            bits = (bits << 1) | (body[78] > 540 ? 1 : 0);
            nbits++;
          }
          if (nbits != 40)
            return;
          uint32_t d_id = (uint32_t) ((bits >> 16) & 0xFFFFFF);
          uint8_t d_ch = (uint8_t) ((bits >> 8) & 0xFF);
          uint8_t d_btn = (uint8_t) ((bits >> 4) & 0xF);
          uint8_t d_chk = (uint8_t) (bits & 0xF);
          std::vector<int> d;
          d.push_back(-1);
          d.push_back((int) (bits >> 32));
          d.push_back((int) (bits & 0xFFFFFFFF));
          id(signal_nvs).save_to_nvs(id(rf_signal_select_index), d);
          ESP_LOGI("RF_LEARNING", "Learned Dooya id=0x%06X channel=%d button=%d check=%d slot=%d",
                   (unsigned int) d_id, (int) d_ch, (int) d_btn, (int) d_chk,
                   id(rf_signal_select_index));
          id(is_rf_learning_mode) = false;
          id(rf_status_text).publish_state("Dooya signal learned!");
    # Kept for boards whose receiver polarity lets ESPHome's own decoder see
    # the full header; on this hardware it never fires (see on_raw above).
    # Harmless overlap: whichever path stores first clears the learning flag.
    on_dooya:
      - lambda: |-
          if (id(is_rf_learning_mode)) {
            uint64_t code = ((uint64_t) x.id << 16) |
                            ((uint64_t) (uint8_t) x.channel << 8) |
                            ((uint64_t) (x.button & 0xF) << 4) |
                            (uint64_t) (x.check & 0xF);
            std::vector<int> d;
            d.push_back(-1);
            d.push_back((int) (code >> 32));
            d.push_back((int) (code & 0xFFFFFFFF));
            id(signal_nvs).save_to_nvs(id(rf_signal_select_index), d);
            ESP_LOGI("RF_LEARNING", "Learned Dooya id=0x%06X channel=%d button=%d check=%d slot=%d",
                     (unsigned int) x.id, (int) x.channel, (int) x.button, (int) x.check,
                     id(rf_signal_select_index));
            id(is_rf_learning_mode) = false;
            id(rf_status_text).publish_state("Dooya signal learned!");
          }

  - pin:
      number: ${IR_RX_PIN}
      inverted: true
    dump: all
    tolerance: 25%
    idle: 65500us
    clock_resolution: "500000"
    id: ir_receiver
    on_raw:
      - lambda: |-
          if (id(is_learning_mode)) {
            if (x.size() > id(filter_size)) {
              id(signal_nvs).save_to_nvs(id(signal_select_index), x);
              ESP_LOGI("IR_LEARNING", "Signal saved to slot %d, size: %d", id(signal_select_index), x.size());
              id(is_learning_mode) = false;
              id(status_text).publish_state("Signal learned!");
            } else {
              ESP_LOGW("IR_LEARNING", "Signal too short: %d", x.size());
            }
          }

remote_transmitter:
  - pin:
      number: ${RF_TX_PIN}
    # OOK modulation for RF433 — keep duty at 100%
    carrier_duty_percent: 100%
    non_blocking: true
    id: rf_transmitter

  - pin:
      number: ${IR_TX_PIN}
      inverted: false
    carrier_duty_percent: 50%
    non_blocking: true
    id: ir_transmitter

infrared:
  - platform: ir_rf_proxy
    name: IR Proxy Transmitter
    id: ir_proxy_transmitter
    remote_transmitter_id: ir_transmitter

  - platform: ir_rf_proxy
    name: IR Proxy Receiver
    id: ir_proxy_receiver
    receiver_frequency: 38kHz
    remote_receiver_id: ir_receiver

  # RF transmitter instance
radio_frequency:
  - platform: ir_rf_proxy
    name: 433MHz RF Transmitter
    id: rf_proxy_transmitter
    frequency: 433.92MHz
    remote_transmitter_id: rf_transmitter

  - platform: ir_rf_proxy
    name: 433MHz RF Receiver
    id: rf_proxy_receiver
    frequency: 433.92MHz
    remote_receiver_id: rf_receiver

climate:
  - id: "AC"
    name: "AC"
    platform: ${AC_Platform_name}
    transmitter_id: ir_transmitter
    receiver_id: ir_receiver

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: "diagnostic"

  - platform: gpio
    pin:
      number: ${Button_PIN}
      mode:
        input: true
      inverted: true
    name: "Button"
    disabled_by_default: true
    on_multi_click:
      - timing:
          - ON for at least 4s
        then:
          - button.press: Reset

sensor:
  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor
    type:
      timestamp
    entity_category: "diagnostic"

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: factory_reset
    name: "Factory Reset"
    id: Reset
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config

  # IR learning button
  - platform: template
    name: "IR Learn"
    icon: mdi:remote-tv
    on_press:
      - lambda: |-
          id(is_learning_mode) = true;
          ESP_LOGI("IR_LEARNING", "Learning mode activated for slot %d", id(signal_select_index));
          id(status_text).publish_state("Ready to learn...");

  # IR send button
  - platform: template
    name: "IR Send"
    icon: mdi:send
    on_press:
      - script.execute: send_raw_signal

  # Clear the signal in the current slot
  - platform: template
    name: "IR Clear Slot"
    icon: mdi:delete
    on_press:
      - lambda: |-
          std::vector<int> empty_signal;
          id(signal_nvs).save_to_nvs(id(signal_select_index), empty_signal);
          ESP_LOGI("IR_LEARNING", "Cleared slot %d", id(signal_select_index));
          id(status_text).publish_state("Slot cleared");

  # RF433 learning button
  - platform: template
    name: "RF Learn"
    icon: mdi:remote
    on_press:
      - lambda: |-
          id(is_rf_learning_mode) = true;
          ESP_LOGI("RF_LEARNING", "Learning mode activated for slot %d", id(rf_signal_select_index));
          id(rf_status_text).publish_state("Ready to learn...");

  # RF433 send button
  - platform: template
    name: "RF Send"
    icon: mdi:send
    on_press:
      - script.execute: send_raw_rf_signal

  # Clear the RF signal in the current slot
  - platform: template
    name: "RF Clear Slot"
    icon: mdi:delete
    on_press:
      - lambda: |-
          std::vector<int> empty_signal;
          id(signal_nvs).save_to_nvs(id(rf_signal_select_index), empty_signal);
          ESP_LOGI("RF_LEARNING", "Cleared slot %d", id(rf_signal_select_index));
          id(rf_status_text).publish_state("Slot cleared");

light:
  - platform: status_led
    name: "Status LED"
    disabled_by_default: true
    pin: ${LED_PIN}

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      id: ssid
      entity_category: diagnostic
    mac_address:
      name: "Mac Address"
      id: mac_address
      entity_category: diagnostic

  - platform: template
    name: "Last Restart"
    id: device_last_restart
    icon: mdi:clock
    entity_category: diagnostic

  # IR learning status display
  - platform: template
    name: "IR Learning Status"
    id: status_text
    icon: mdi:information

  # RF433 learning status display
  - platform: template
    name: "RF Learning Status"
    id: rf_status_text
    icon: mdi:information

# Signal slot selector
select:
  - platform: template
    name: "IR Signal Slot"
    id: signal_slot_select
    optimistic: true
    options:
      - "Signal 0"
      - "Signal 1"
      - "Signal 2"
      - "Signal 3"
      - "Signal 4"
      - "Signal 5"
      - "Signal 6"
      - "Signal 7"
      - "Signal 8"
      - "Signal 9"
    initial_option: "Signal 0"
    on_value:
      - lambda: |-
          if (x == "Signal 0") id(signal_select_index) = 0;
          else if (x == "Signal 1") id(signal_select_index) = 1;
          else if (x == "Signal 2") id(signal_select_index) = 2;
          else if (x == "Signal 3") id(signal_select_index) = 3;
          else if (x == "Signal 4") id(signal_select_index) = 4;
          else if (x == "Signal 5") id(signal_select_index) = 5;
          else if (x == "Signal 6") id(signal_select_index) = 6;
          else if (x == "Signal 7") id(signal_select_index) = 7;
          else if (x == "Signal 8") id(signal_select_index) = 8;
          else if (x == "Signal 9") id(signal_select_index) = 9;
          ESP_LOGI("IR_LEARNING", "Selected slot: %d", id(signal_select_index));

  # RF433 signal slot selector (mapped to NVS index 10-19 to avoid IR collision)
  - platform: template
    name: "RF Signal Slot"
    id: rf_signal_slot_select
    optimistic: true
    options:
      - "Signal 0"
      - "Signal 1"
      - "Signal 2"
      - "Signal 3"
      - "Signal 4"
      - "Signal 5"
      - "Signal 6"
      - "Signal 7"
      - "Signal 8"
      - "Signal 9"
      - "Signal 10"
      - "Signal 11"
      - "Signal 12"
      - "Signal 13"
      - "Signal 14"
      - "Signal 15"
    initial_option: "Signal 0"
    on_value:
      - lambda: |-
          if (x == "Signal 0") id(rf_signal_select_index) = 10;
          else if (x == "Signal 1") id(rf_signal_select_index) = 11;
          else if (x == "Signal 2") id(rf_signal_select_index) = 12;
          else if (x == "Signal 3") id(rf_signal_select_index) = 13;
          else if (x == "Signal 4") id(rf_signal_select_index) = 14;
          else if (x == "Signal 5") id(rf_signal_select_index) = 15;
          else if (x == "Signal 6") id(rf_signal_select_index) = 16;
          else if (x == "Signal 7") id(rf_signal_select_index) = 17;
          else if (x == "Signal 8") id(rf_signal_select_index) = 18;
          else if (x == "Signal 9") id(rf_signal_select_index) = 19;
          else if (x == "Signal 10") id(rf_signal_select_index) = 20;
          else if (x == "Signal 11") id(rf_signal_select_index) = 21;
          else if (x == "Signal 12") id(rf_signal_select_index) = 22;
          else if (x == "Signal 13") id(rf_signal_select_index) = 23;
          else if (x == "Signal 14") id(rf_signal_select_index) = 24;
          else if (x == "Signal 15") id(rf_signal_select_index) = 25;
          ESP_LOGI("RF_LEARNING", "Selected slot: %d", id(rf_signal_select_index));

# Script for sending raw IR signals
script:
  - id: send_raw_signal
    then:
      - lambda: |-
          std::vector<int> signal_data = id(signal_nvs).load_from_nvs<int>(id(signal_select_index));
          if (signal_data.size() > 0) {
            ESP_LOGI("IR_SEND", "Sending signal from slot %d, size: %d", id(signal_select_index), signal_data.size());
            id(status_text).publish_state("Sending signal...");
            auto transmit = id(ir_transmitter).transmit();
            auto data = transmit.get_data();
            data->set_carrier_frequency(38000);
            for (int i = 0; i < signal_data.size(); i++) {
              if (i % 2 == 0) {
                data->mark(signal_data[i]);
              } else {
                data->space(signal_data[i]);
              }
            }
            transmit.perform();
            id(status_text).publish_state("Signal sent!");
          } else {
            ESP_LOGW("IR_SEND", "No signal stored in slot %d", id(signal_select_index));
            id(status_text).publish_state("No signal in this slot");
          }

  # Transmits the A-OK frame currently in rf_tx_code, following
  # github.com/akirjavainen/A-OK exactly: AGC 5300us HIGH + 530us LOW, then 65
  # bits (bit 0 = 270us HIGH + 565us LOW, bit 1 = 565us HIGH + 270us LOW; the
  # 65th bit is a constant 1), then 5030us of radio silence, the whole command
  # repeated 8 times. The stored code holds the first 64 bits; the constant
  # trailing 1 is appended here, and its LOW half merges into the silence.
  - id: aok_send
    then:
      - lambda: |-
          uint64_t code = id(rf_tx_code);
          std::vector<int32_t> w;
          w.reserve(2 + 2 * 65);
          w.push_back(5300);
          w.push_back(-530);
          for (int i = 63; i >= 0; i--) {
            if ((code >> i) & 1) { w.push_back(565); w.push_back(-270); }
            else                 { w.push_back(270); w.push_back(-565); }
          }
          w.push_back(565);
          w.push_back(-(270 + 5030));
          id(rf_aok_buf) = w;
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_transmitter
          carrier_frequency: 0Hz
          code: !lambda 'return id(rf_aok_buf);'
          repeat:
            times: 8
            wait_time: 0us

  # Script for sending learned RF433 signals
  - id: send_raw_rf_signal
    then:
      # Load [type, code_high, code_low] from NVS and rebuild the 64-bit code
      # into the temp globals that the transmit branches read via !lambda.
      # type > 0 is an rc_switch protocol number; type -1 is Dooya; -2 is A-OK.
      - lambda: |-
          std::vector<int> d = id(signal_nvs).load_from_nvs<int>(id(rf_signal_select_index));
          if (d.size() >= 3) {
            id(rf_tx_protocol) = d[0];
            id(rf_tx_code) = ((uint64_t) (uint32_t) d[1] << 32) | (uint32_t) d[2];
            ESP_LOGI("RF_SEND", "Sending type=%d code=%llu slot=%d",
                     id(rf_tx_protocol), (unsigned long long) id(rf_tx_code), id(rf_signal_select_index));
            id(rf_status_text).publish_state("Sending signal...");
          } else {
            id(rf_tx_protocol) = 0;
            ESP_LOGW("RF_SEND", "No signal stored in slot %d", id(rf_signal_select_index));
            id(rf_status_text).publish_state("No signal in this slot");
          }
      # Dooya playback through ESPHome's own encoder, from the stored fields.
      # repeat 8 x 7755us matches what real Dooya remotes transmit; a single
      # frame is not accepted by the motors.
      - if:
          condition:
            lambda: 'return id(rf_tx_protocol) == -1;'
          then:
            - remote_transmitter.transmit_dooya:
                transmitter_id: rf_transmitter
                id: !lambda 'return (uint32_t) ((id(rf_tx_code) >> 16) & 0xFFFFFF);'
                channel: !lambda 'return (uint8_t) ((id(rf_tx_code) >> 8) & 0xFF);'
                button: !lambda 'return (uint8_t) ((id(rf_tx_code) >> 4) & 0xF);'
                check: !lambda 'return (uint8_t) (id(rf_tx_code) & 0xF);'
                repeat:
                  times: 8
                  wait_time: 7755us
            - lambda: 'id(rf_status_text).publish_state("Signal sent!");'
      # A-OK playback. After an UP or DOWN, the real remote transmits a second
      # burst with cmd 0x24 ("after up/down" in akirjavainen/A-OK), so playback
      # reproduces that: same ID and address, cmd 0x24, checksum recomputed.
      # STOP and everything else is a single burst, exactly like the remote.
      - if:
          condition:
            lambda: 'return id(rf_tx_protocol) == -2;'
          then:
            - script.execute: aok_send
            - script.wait: aok_send
            - if:
                condition:
                  lambda: |-
                    uint8_t cmd = (uint8_t) (id(rf_tx_code) >> 8);
                    return cmd == 0x0B || cmd == 0x43;
                then:
                  - lambda: |-
                      uint64_t code = id(rf_tx_code);
                      uint8_t b[8];
                      for (int i = 0; i < 8; i++) b[i] = (uint8_t) (code >> (56 - 8 * i));
                      b[6] = 0x24;
                      b[7] = (uint8_t) ((b[1] + b[2] + b[3] + b[4] + b[5] + b[6]) & 0xFF);
                      uint64_t fu = 0;
                      for (int i = 0; i < 8; i++) fu = (fu << 8) | b[i];
                      id(rf_tx_code) = fu;
                  - script.execute: aok_send
                  - script.wait: aok_send
            - lambda: 'id(rf_status_text).publish_state("Signal sent!");'
      - if:
          condition:
            lambda: 'return id(rf_tx_protocol) > 0;'
          then:
            - remote_transmitter.transmit_rc_switch_raw:
                # protocol must be an RCSwitchBase: index the built-in table (1..8)
                protocol: !lambda 'return esphome::remote_base::RC_SWITCH_PROTOCOLS[id(rf_tx_protocol)];'
                # code must be an MSB-first binary string; its length is the bit count.
                # on_rc_switch does not expose the received bit length, and virtually
                # all 433MHz fixed-code remotes (EV1527/PT2262/…) are 24-bit.
                code: !lambda |-
                  uint64_t code = id(rf_tx_code);
                  const int nbits = 24;
                  std::string s;
                  for (int i = nbits - 1; i >= 0; i--)
                    s += (code & ((uint64_t) 1 << i)) ? '1' : '0';
                  return s;
                transmitter_id: rf_transmitter
                repeat:
                  times: 5
                  wait_time: 0us
            - lambda: 'id(rf_status_text).publish_state("Signal sent!");'

time:
  - platform: sntp
    id: sntp_time
  # Define the timezone of the device
    timezone: "${timezone}"
  # Change sync interval from default 5min to 6 hours (or as set in substitutions)
    update_interval: ${sntp_update_interval}
  # Set specific sntp servers to use
    servers:
      - "${sntp_server_1}"
      - "${sntp_server_2}"
      - "${sntp_server_3}"
  # Publish the time the device was last restarted
    on_time_sync:
      then:
        # Update last restart time, but only once.
        - if:
            condition:
              lambda: 'return id(device_last_restart).state == "";'
            then:
              - text_sensor.template.publish:
                  id: device_last_restart
                  state: !lambda 'return id(sntp_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'
