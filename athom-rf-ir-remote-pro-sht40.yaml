# Athom RF433 IR Remote Pro with an external SHT40 temperature/humidity sensor.
# Builds on athom-rf-ir-remote-pro.yaml; switch between Standard / SHT40 / SCD40
# firmware from Home Assistant with "Firmware Variant" + "Install Selected Firmware".
substitutions:
  firmware_variant: "With sht40 sensor"
  firmware_file: "athom-rf-ir-remote-pro-sht40"
  device_description: "athom esp32 RF433 IR Remote Pro(Optional external I2C sensor: SHT40 or SCD40)"
  # Fixed calibration offsets applied before the user-adjustable offsets
  temperature_offset: "0"
  humidity_offset: "0"
  # SHT40 polling interval
  sensor_update_interval: 5s

packages:
  base: !include athom-rf-ir-remote-pro.yaml

i2c:
  sda: ${I2C_SDA_PIN}
  scl: ${I2C_SCL_PIN}
  scan: true
  id: bus_a

sensor:
  - platform: sht4x
    i2c_id: bus_a
    id: sht40_sensor
    update_interval: ${sensor_update_interval}
    temperature:
      name: "Temperature"
      id: temperature_sensor
      filters:
        - offset: ${temperature_offset}
        - lambda: "return x + id(temperature_offset_selection).state;"
    humidity:
      name: "Humidity"
      id: humidity_sensor
      filters:
        - offset: ${humidity_offset}
        - lambda: "return x + id(humidity_offset_selection).state;"

number:
  - platform: template
    name: "Temperature Offset"
    id: temperature_offset_selection
    unit_of_measurement: "°C"
    min_value: -10
    max_value: 10
    step: 0.1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:thermometer"
    entity_category: config
    on_value:
      - lambda: 'id(sht40_sensor).update();'

  - platform: template
    name: "Humidity Offset"
    id: humidity_offset_selection
    unit_of_measurement: "%"
    min_value: -30
    max_value: 30
    step: 0.1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:water-percent"
    entity_category: config
    on_value:
      - lambda: 'id(sht40_sensor).update();'
